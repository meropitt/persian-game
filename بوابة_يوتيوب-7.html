<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بوابة يوتيوب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F5; --card:#FFFFFF; --ink:#26333B; --sub:#7A8890;
  --blue:#4A7A96; --blue-d:#365A70; --amber:#F2A93B; --amber-d:#C9861F;
  --green:#7FAE8C; --green-d:#5E8B6C; --red:#D9634F; --line:#DCE4E8; --yt:#E23744;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1B2328; --card:#232E34; --ink:#EDF2F4; --line:#33424A; --sub:#8FA0A8; }
}
:root[data-theme="dark"]{ --bg:#1B2328; --card:#232E34; --ink:#EDF2F4; --line:#33424A; --sub:#8FA0A8; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Cairo',Tahoma,Arial,sans-serif; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; overflow:hidden}
.gear{position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); left:14px; font-size:1.3rem; background:none; border:none; cursor:pointer; z-index:5; opacity:.55}
main{flex:1; display:flex; align-items:center; justify-content:center; padding:20px; overflow-y:auto}
.screen{display:none; width:100%; max-width:480px; text-align:center}
.screen.active{display:block; animation:fade .25s ease}
@keyframes fade{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

/* home */
.ytBtn{background:var(--yt); color:#fff; border:none; border-radius:26px; padding:34px 20px; font-size:1.6rem; font-weight:800; font-family:inherit; cursor:pointer; width:100%; box-shadow:0 8px 0 #A82A32}
.ytBtn:active{transform:translateY(4px); box-shadow:0 4px 0 #A82A32}
.ytBtn .big{font-size:3rem; display:block; margin-bottom:8px}

/* quiz */
.dots{display:flex; justify-content:center; gap:8px; margin-bottom:18px}
.dot{width:16px; height:16px; border-radius:50%; background:var(--line)}
.dot.on{background:var(--green)}
.qcard{background:var(--card); border:2px solid var(--line); border-radius:20px; padding:20px 16px}
.qtext{font-size:1.2rem; font-weight:800; margin-bottom:10px}
.qvisual{font-size:2rem; letter-spacing:4px; margin:10px 0; line-height:1.3}
.opts{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px}
.opt{background:var(--bg); border:2px solid var(--line); border-radius:16px; padding:16px 8px; font-size:1.15rem; font-weight:700; cursor:pointer; font-family:inherit; color:var(--ink); display:flex; align-items:center; justify-content:center; gap:6px}
.opt:active{transform:scale(.95)}
.swatch{width:20px; height:20px; border-radius:50%; display:inline-block; border:1px solid #0002}

.feedback{position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:10; background:rgba(0,0,0,.35)}
.feedback.show{display:flex}
.fbox{background:var(--card); border-radius:24px; padding:34px 26px; text-align:center; max-width:340px}
.fbox .em{font-size:3.4rem}
.fbox h3{margin:10px 0 4px; font-size:1.3rem}
.fbox.good h3{color:var(--green-d)}
.fbox.bad h3{color:var(--red)}
.fbox p{color:var(--sub); font-size:.95rem; margin:0}

/* unlock */
.unlock .em{font-size:4rem}
.unlock h2{color:var(--green-d)}

/* settings */
.settings input{width:100%; padding:12px; border-radius:12px; border:2px solid var(--line); font-family:inherit; font-size:1rem; margin:12px 0; text-align:left}
.recRow{display:flex; align-items:center; gap:10px; background:var(--card); border:2px solid var(--line); border-radius:14px; padding:10px 12px}
.recRow.done{border-color:var(--green)}
.recRow .lbl{flex:1; font-weight:700; font-size:1.1rem}
.recRow .mic2{width:34px; height:34px; border-radius:50%; border:none; background:var(--bg); font-size:1rem; cursor:pointer}
.recRow.done .mic2{background:var(--green); color:#fff}
.recRow.rec .mic2{background:var(--red); color:#fff; animation:pulse2 1s infinite}
@keyframes pulse2{50%{opacity:.5}}
.recRow{display:flex; align-items:center; gap:10px; background:var(--card); border:2px solid var(--line); border-radius:14px; padding:10px 12px}
.recRow.done{border-color:var(--green)}
.recRow .lbl{flex:1; font-weight:700; font-size:1.1rem}
.recRow .mic2{width:34px; height:34px; border-radius:50%; border:none; background:var(--bg); font-size:1rem; cursor:pointer}
.recRow.done .mic2{background:var(--green); color:#fff}
.recRow.rec .mic2{background:var(--red); color:#fff; animation:pulse2 1s infinite}
@keyframes pulse2{50%{opacity:.5}}
.btn{background:var(--blue); color:#fff; border:none; border-radius:14px; padding:13px 26px; font-size:1rem; font-weight:700; font-family:inherit; cursor:pointer; margin-top:10px; width:100%}
.btn.amber{background:var(--amber)}
.btn.ghost{background:none; color:var(--sub); box-shadow:none}
</style>
</head>
<body>

<main>
  <section class="screen active" id="s-home">
    <button class="ytBtn" id="ytHomeBtn"><span class="big">▶️</span>يوتيوب</button>
    <button class="btn ghost" id="testVoice" style="margin-top:18px">🔊 اختبر الصوت</button>
    <button class="btn ghost" id="openRec" style="margin-top:8px">🎙️ سجل صوتك (بديل احتياطي)</button>
  </section>

  <section class="screen" id="s-rec">
    <div style="text-align:right; max-width:480px; margin:0 auto">
      <p id="recProgress" style="text-align:center; font-weight:700; color:var(--sub)"></p>
      <div id="recList" style="display:flex; flex-direction:column; gap:8px; max-height:70vh; overflow-y:auto"></div>
      <button class="btn ghost" id="closeRec" style="margin-top:14px">رجوع</button>
    </div>
  </section>

  <section class="screen" id="s-quiz">
    <div class="dots" id="dots"></div>
    <div class="qcard">
      <div class="qtext" id="qtext"></div>
      <div class="qvisual" id="qvisual"></div>
      <div class="opts" id="opts"></div>
    </div>
  </section>

  <section class="screen unlock" id="s-unlock">
    <div class="em">🎉📺🎉</div>
    <h2>أحسنت! جاري فتح يوتيوب...</h2>
    <button class="btn" id="goYt">افتح يوتيوب الآن</button>
    <button class="btn ghost" id="editLink" style="margin-top:6px">تغيير رابط القناة</button>
  </section>
</main>

<div class="feedback" id="feedback">
  <div class="fbox" id="fbox">
    <div class="em" id="fem"></div>
    <h3 id="ftitle"></h3>
    <p id="fsub"></p>
  </div>
</div>

<script>
function go(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

function pickDistractors(pool, correct, n){
  const others = pool.filter(x=>x!==correct);
  const shuffled = others.sort(()=>Math.random()-.5);
  return shuffled.slice(0,n);
}
function shuffle(a){ return a.sort(()=>Math.random()-.5); }

// ---- data ----
const letters = [['أ','أسد','🦁'],['ب','بطة','🦆'],['ت','تفاح','🍎'],['ث','ثعلب','🦊'],['ج','جمل','🐫'],['ح','حصان','🐴'],['خ','خروف','🐑'],['د','دب','🐻'],['ذ','ذئب','🐺'],['ر','رمان','🔴'],['ز','زرافة','🦒'],['س','سمك','🐟'],['ش','شمس','☀️'],['ص','صقر','🦅'],['ض','ضفدع','🐸'],['ط','طائرة','✈️'],['ظ','ظرف','✉️'],['ع','عصفور','🐦'],['غ','غزال','🦌'],['ف','فيل','🐘'],['ق','قمر','🌙'],['ك','كرة','⚽'],['ل','ليمون','🍋'],['م','موز','🍌'],['ن','نجمة','⭐'],['ه','هدية','🎁'],['و','وردة','🌹'],['ي','يد','✋']];
const colors = [['أحمر',['🍎','🍓','🌹']],['أصفر',['🍋','🌻','🍌']],['أخضر',['🥦','🐸','🍀']],['أزرق',['🔵','🐳','🌊']],['برتقالي',['🍊','🥕']],['بنفسجي',['🍇','🍆']]];
const colorHex = {'أحمر':'#D9534F','أصفر':'#F2C94C','أخضر':'#6FCF97','أزرق':'#4A90D9','برتقالي':'#F2A93B','بنفسجي':'#9B6FC9'};
const shapes = [['دائرة','⚪'],['مربع','⬛'],['مثلث','🔺'],['نجمة','⭐'],['قلب','❤️'],['معين','🔶']];
const animals = [['قطة','مواء','🐱'],['كلب','هو هو','🐶'],['بقرة','موو','🐮'],['خروف','مإإ','🐑'],['أسد','زئير','🦁'],['حصان','صهيل','🐴'],['ديك','كوكوكو','🐓'],['بطة','قاق','🦆']];
const countEmojis = ['🍎','🍌','🍇','⭐','🐱','🐶','🎈','🌸','🐦','🎁'];

let bank = [];

// letters
letters.forEach(([l,w,e])=>{
  const letterPool = letters.map(x=>x[0]);
  bank.push({q:`وين حرف ${l}؟`, visual:'', opts: shuffle([l,...pickDistractors(letterPool,l,3)]), correct:l, speakT:`وين حرف ${l}`, tokens:['c_وين','c_حرف','l_'+l]});
  const wordPool = letters.map(x=>x[1]+' '+x[2]);
  const correctW = w+' '+e;
  bank.push({q:`شنو الكلمة اللي تبدأ بحرف ${l}؟`, visual:'', opts: shuffle([correctW,...pickDistractors(wordPool,correctW,3)]), correct:correctW, speakT:`شنو الكلمة اللي تبدأ بحرف ${l}`, tokens:['c_شنو','c_الكلمة','c_اللي','c_تبدأ','c_بحرف','l_'+l]});
});

// colors
colors.forEach(([name,emojis])=>{
  const colorPool = colors.map(c=>c[0]);
  emojis.forEach(e=>{
    bank.push({q:`شنو لون الـ ${e} ؟`, visual:e, opts: shuffle([name,...pickDistractors(colorPool,name,3)]), correct:name, speakT:`شنو لون هذا الشي`, swatch:true, tokens:['fp_color']});
  });
});

// shapes
shapes.forEach(([name,e])=>{
  const namePool = shapes.map(s=>s[0]);
  const emojiPool = shapes.map(s=>s[1]);
  bank.push({q:'شنو اسم هذا الشكل؟', visual:e, opts: shuffle([name,...pickDistractors(namePool,name,3)]), correct:name, speakT:'شنو اسم هذا الشكل', tokens:['fp_shapeName']});
  bank.push({q:`وين شكل الـ ${name}؟`, visual:'', opts: shuffle([e,...pickDistractors(emojiPool,e,3)]), correct:e, speakT:`وين شكل ${name}`, tokens:['c_وين','c_شكل','c_الـ','s_'+name]});
});

// animals
animals.forEach(([name,sound,e],i)=>{
  const namePool = animals.map(a=>a[0]+' '+a[2]);
  const soundPool = animals.map(a=>a[1]);
  const nameOpt = name+' '+e;
  bank.push({q:`مين يقول "${sound}"؟`, visual:'', opts: shuffle([nameOpt,...pickDistractors(namePool,nameOpt,3)]), correct:nameOpt, speakT:`مين يقول ${sound}`, tokens:['c_مين','c_يقول','as_'+i]});
  bank.push({q:`شنو صوت الـ ${name} ${e}؟`, visual:'', opts: shuffle([sound,...pickDistractors(soundPool,sound,3)]), correct:sound, speakT:`شنو صوت ${name}`, tokens:['c_شنو','c_صوت','an_'+i]});
});

// counting
countEmojis.forEach(e=>{
  for(let n=1;n<=10;n++){
    const visual = (e+' ').repeat(n).trim();
    const numPool = Array.from({length:12},(_,i)=>i+1);
    bank.push({q:'كم عدد هذي؟', visual, opts: shuffle([n,...pickDistractors(numPool,n,3)].map(String)), correct:String(n), speakT:'كم عدد هذي', tokens:['fp_count']});
  }
});

// addition (results <=10)
for(let a=1;a<=9;a++){ for(let b=1;b<=9-a+1 && a+b<=10;b++){
  const sum=a+b; const numPool = Array.from({length:14},(_,i)=>i);
  bank.push({q:`كم يساوي ${a} + ${b} ؟`, visual:'', opts: shuffle([sum,...pickDistractors(numPool,sum,3)].map(String)), correct:String(sum), speakT:`كم يساوي ${a} زائد ${b}`, tokens:['c_كم','c_يساوي','num_'+a,'c_زائد','num_'+b]});
}}

// subtraction
for(let a=2;a<=10;a++){ for(let b=1;b<a;b++){
  const diff=a-b; const numPool = Array.from({length:12},(_,i)=>i);
  bank.push({q:`كم يساوي ${a} - ${b} ؟`, visual:'', opts: shuffle([diff,...pickDistractors(numPool,diff,3)].map(String)), correct:String(diff), speakT:`كم يساوي ${a} ناقص ${b}`, tokens:['c_كم','c_يساوي','num_'+a,'c_ناقص','num_'+b]});
}}

// ---- recordings needed ----
const connWords = ['وين','حرف','شنو','الكلمة','اللي','تبدأ','بحرف','شكل','الـ','مين','يقول','صوت','كم','يساوي','زائد','ناقص'];
let recordingsList = connWords.map(w=>({id:'c_'+w, label:w}));
recordingsList.push({id:'fp_color', label:'شنو لون هذا الشي'});
recordingsList.push({id:'fp_shapeName', label:'شنو اسم هذا الشكل'});
recordingsList.push({id:'fp_count', label:'كم عدد هذي'});
recordingsList.push({id:'fb_correct', label:'صح أحسنت'});
recordingsList.push({id:'fb_wrong', label:'اهدئ قليلا ثم حاول مجددا'});
recordingsList.push({id:'fb_wrong2', label:'اهدئ وتذكر بأن إجاباتك الصحيحة سوف تفتح لك اليوتيوب لا تتعصب لكي تستطيع مشاهدة أفلام الكرتون'});
letters.forEach(([l])=> recordingsList.push({id:'l_'+l, label:l}));
shapes.forEach(([name])=> recordingsList.push({id:'s_'+name, label:name}));
animals.forEach(([name,sound],i)=>{
  recordingsList.push({id:'an_'+i, label:name});
  recordingsList.push({id:'as_'+i, label:sound});
});
for(let n=0;n<=12;n++) recordingsList.push({id:'num_'+n, label:String(n)});

// ---- Fish Audio (live AI voice via API) ----
// (المفتاح الآن محفوظ بأمان على الخادم فقط، مو هنا)
// ---- Fish Audio via server-side proxy (Netlify Function, no CORS issue) ----
async function fishTTS(text){
  try{
    const res = await fetch('/.netlify/functions/tts', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ text })
    });
    if(!res.ok){
      let bodyText=''; try{ bodyText = await res.text(); }catch(e){}
      return {ok:false, error:'HTTP '+res.status+' — '+bodyText.slice(0,200)};
    }
    const blob = await res.blob();
    const dataUrl = await new Promise(resolve=>{
      const r = new FileReader();
      r.onloadend = ()=>resolve(r.result);
      r.onerror = ()=>resolve(null);
      r.readAsDataURL(blob);
    });
    return {ok:true, dataUrl};
  }catch(e){ return {ok:false, error:'خطأ شبكة: '+(e && e.message ? e.message : String(e))}; }
}
let currentAudio = null;
function stopCurrentAudio(){
  if(currentAudio){ try{ currentAudio.pause(); currentAudio.currentTime=0; }catch(e){} currentAudio=null; }
  try{ speechSynthesis.cancel(); }catch(e){}
}

async function speakSmart(text, tokensFallback){
  const r = await fishTTS(text);
  if(r.ok && r.dataUrl){
    return new Promise(resolve=>{
      const a = new Audio(r.dataUrl);
      currentAudio = a;
      const done = ()=>{ if(currentAudio===a) currentAudio=null; resolve(); };
      a.onended = done; a.onerror = ()=>{ done(); };
      a.play().then(()=>{}).catch(()=>{ if(currentAudio===a) currentAudio=null; playTokens(tokensFallback).then(resolve); });
    });
  } else {
    return playTokens(tokensFallback);
  }
}

// ---- AI voice (device text-to-speech) ----
let ttsVoice = null;
function pickVoice(){
  try{
    const list = speechSynthesis.getVoices();
    const arVoices = list.filter(v=>v.lang && v.lang.startsWith('ar'));
    ttsVoice = arVoices[0] || null;
  }catch(e){ ttsVoice = null; }
}
try{ if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } }catch(e){}
function speakAI(text){
  try{
    if(!ttsVoice || !text) return;
    const u = new SpeechSynthesisUtterance(text);
    u.voice = ttsVoice; u.lang = ttsVoice.lang; u.rate = 0.88;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

// ---- voice storage & playback (recorded voice takes priority, AI voice is automatic fallback) ----
let voices = {};
try{ voices = JSON.parse(localStorage.getItem('gateVoices')||'{}'); }catch(e){}
function saveVoices(){ try{ localStorage.setItem('gateVoices', JSON.stringify(voices)); }catch(e){} }

function playTokens(tokens){
  return new Promise(resolve=>{
    if(!tokens || !tokens.length){ resolve(); return; }
    const allRecorded = tokens.every(t=>!!voices[t]);
    if(allRecorded){
      let i=0;
      function playOne(){
        if(i>=tokens.length){ resolve(); return; }
        const a = new Audio(voices[tokens[i]]);
        currentAudio = a;
        const advance = ()=>{ if(currentAudio===a) currentAudio=null; i++; playOne(); };
        a.onended = advance; a.onerror = advance;
        a.play().catch(advance);
      }
      playOne();
    } else {
      const text = tokens.map(t=>{ const item = recordingsList.find(r=>r.id===t); return item ? item.label : ''; }).join(' ');
      speakAI(text);
      resolve();
    }
  });
}


// ---- quiz engine ----
const NEEDED = 5;
let correctSoFar = 0;
let used = [];
let current = null;
let wrongStreak = 0;

function renderDots(){
  const d = document.getElementById('dots'); d.innerHTML='';
  for(let i=0;i<NEEDED;i++){ const s=document.createElement('div'); s.className='dot'+(i<correctSoFar?' on':''); d.appendChild(s); }
}

function renderQuestion(){
  stopCurrentAudio();
  document.getElementById('qtext').textContent = current.q;
  document.getElementById('qvisual').textContent = current.visual||'';
  const optsEl = document.getElementById('opts');
  optsEl.innerHTML='';
  shuffle(current.opts);
  current.opts.forEach(o=>{
    const b = document.createElement('button');
    b.className='opt';
    if(current.swatch){ b.innerHTML = `<span class="swatch" style="background:${colorHex[o]}"></span>${o}`; }
    else{ b.textContent = o; }
    b.onclick = ()=>answer(o===current.correct, o);
    optsEl.appendChild(b);
  });
  renderDots();
  speakSmart(current.speakT, current.tokens||[]);
}

function nextQuestion(){
  wrongStreak = 0;
  let pool = bank.filter((_,i)=>!used.includes(i));
  if(pool.length===0){ used=[]; pool=bank; }
  const idx = bank.indexOf(pool[Math.floor(Math.random()*pool.length)]);
  used.push(idx);
  current = bank[idx];
  renderQuestion();
}

async function answer(isCorrect, selectedText){
  document.querySelectorAll('.opt').forEach(o=>o.style.pointerEvents='none');
  stopCurrentAudio();

  const fb = document.getElementById('feedback'); const box=document.getElementById('fbox');
  box.className='fbox '+(isCorrect?'good':'bad');
  document.getElementById('fem').textContent = isCorrect ? '✅' : '🌬️';
  document.getElementById('ftitle').textContent = isCorrect ? 'صح! أحسنت' : 'خطأ';
  fb.classList.add('show');

  // 1) اقرأ الإجابة اللي ضغطها
  await speakSmart(String(selectedText), []);

  // 2) رسالة صح/خطأ (مع تصعيد لو أخطأ بنفس السؤال أكثر من مرة)
  let feedbackText, feedbackTokens;
  if(isCorrect){
    feedbackText = 'صح أحسنت';
    feedbackTokens = ['fb_correct'];
    document.getElementById('fsub').textContent = '';
  } else {
    wrongStreak++;
    if(wrongStreak>=2){
      feedbackText = 'اهدئ وتذكر بأن إجاباتك الصحيحة سوف تفتح لك اليوتيوب، لا تتعصب لكي تستطيع مشاهدة أفلام الكرتون';
      feedbackTokens = ['fb_wrong2'];
    } else {
      feedbackText = 'اهدئ قليلا ثم حاول مجددا';
      feedbackTokens = ['fb_wrong'];
    }
    document.getElementById('fsub').textContent = feedbackText;
  }
  await speakSmart(feedbackText, feedbackTokens);

  fb.classList.remove('show');
  document.querySelectorAll('.opt').forEach(o=>o.style.pointerEvents='');
  if(isCorrect){
    correctSoFar++;
    wrongStreak = 0;
    if(correctSoFar>=NEEDED){ go('s-unlock'); return; }
    nextQuestion();
  } else {
    renderQuestion();
  }
}

document.getElementById('ytHomeBtn').onclick = async ()=>{
  correctSoFar=0; used=[]; wrongStreak=0;
  await speakSmart('حتى تدخل لليوتيوب وتشوف أفلام كرتون، لازم تحل هذي الخمس أسئلة', []);
  go('s-quiz');
  nextQuestion();
};

document.getElementById('goYt').onclick = ()=>{
  let link='https://www.youtube.com/';
  try{ link = localStorage.getItem('ytLink') || link; }catch(e){}
  window.location.href = link;
};
document.getElementById('editLink').onclick = ()=>{
  let cur='https://www.youtube.com/'; try{ cur = localStorage.getItem('ytLink')||cur; }catch(e){}
  const v = prompt('حطوا رابط قناة يوتيوب أو اتركوه للعام:', cur);
  if(v){ try{ localStorage.setItem('ytLink', v); }catch(e){} }
};


document.getElementById('testVoice').onclick = async ()=>{
  const r = await fishTTS('مرحبا، هذا اختبار الصوت');
  if(r.ok && r.dataUrl){
    const a = new Audio(r.dataUrl);
    a.play().catch(()=>alert('Fish Audio نجح، بس المتصفح رفض تشغيل الصوت. جرب مرة ثانية.'));
  } else {
    alert('Fish Audio ما اشتغل. رسالة الخطأ بالضبط:\n\n' + r.error);
  }
};



// recording screen (same-device localStorage)
function renderRecList(){
  const list = document.getElementById('recList');
  list.innerHTML='';
  let doneCount=0;
  recordingsList.forEach(item=>{
    const isDone = !!voices[item.id];
    if(isDone) doneCount++;
    const row = document.createElement('div');
    row.className = 'recRow'+(isDone?' done':'');
    row.innerHTML = `<span class="lbl">${item.label}</span><button class="mic2">🎙️</button>`;
    row.querySelector('.mic2').onclick = ()=>recordOne(item.id, row);
    list.appendChild(row);
  });
  document.getElementById('recProgress').textContent = `سجّلت ${doneCount} من ${recordingsList.length}`;
}
function recordOne(id, row){
  if(row.classList.contains('rec')) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    alert('التسجيل غير مدعوم بهذا المتصفح.'); return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    row.classList.add('rec');
    const chunks=[];
    const rec = new MediaRecorder(stream);
    rec.ondataavailable = e=>chunks.push(e.data);
    rec.onstop = ()=>{
      stream.getTracks().forEach(t=>t.stop());
      const blob = new Blob(chunks, {type:'audio/webm'});
      const reader = new FileReader();
      reader.onloadend = ()=>{
        voices[id] = reader.result;
        saveVoices();
        row.classList.remove('rec');
        renderRecList();
      };
      reader.readAsDataURL(blob);
    };
    rec.start();
    setTimeout(()=>{ if(rec.state==='recording') rec.stop(); }, 2200);
  }).catch(()=>{ alert('ما قدرنا نوصل للمايكروفون. تأكدوا من إذن المايكروفون بالمتصفح.'); });
}
document.getElementById('openRec').onclick = ()=>{ renderRecList(); go('s-rec'); };
document.getElementById('closeRec').onclick = ()=>go('s-home');


</script>
